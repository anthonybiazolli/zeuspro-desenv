version: '3.8'

services:
  # ---------------------------------------------------------
  # 1. PostgreSQL (Banco de Dados Principal)
  # ---------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: zeuspro-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - zeuspro_pg_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - zeuspro-network

  # ---------------------------------------------------------
  # 2. Redis (Cache, Filas e Filas de Disparo)
  # ---------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: zeuspro-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - zeuspro_redis_data:/data
    networks:
      - zeuspro-network

  # ---------------------------------------------------------
  # 3. MongoDB (Requisito exclusivo para Evolution API)
  # ---------------------------------------------------------
  mongodb:
    image: mongo:6
    container_name: zeuspro-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: zeus_pro_mongo_password
    volumes:
      - zeuspro_mongo_data:/data/db
    networks:
      - zeuspro-network

  # ---------------------------------------------------------
  # 4. Evolution API (Motor de Mensageria)
  # ---------------------------------------------------------
  evolution-api:
    image: evoapicloud/evolution-api:v1.8.2
    container_name: zeuspro-evolution
    depends_on:
      - mongodb
      - redis
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=mongodb
      - DATABASE_CONNECTION_URI=mongodb://root:zeus_pro_mongo_password@mongodb:27017/?authSource=admin
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://:${REDIS_PASSWORD}@redis:6379
    volumes:
      - zeuspro_evolution_store:/evolution/store
    networks:
      - zeuspro-network

  # ---------------------------------------------------------
  # 5. Core Backend (NestJS API)
  # ---------------------------------------------------------
  core:
    build:
      context: ./core
      dockerfile: Dockerfile
    container_name: zeuspro-core
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - "${CORE_PORT}:3000"
    environment:
      - CORE_PORT=${CORE_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    networks:
      - zeuspro-network

  # ---------------------------------------------------------
  # 6. AI Engine (FastAPI)
  # ---------------------------------------------------------
  ai_engine:
    build:
      context: ./ai_engine
      dockerfile: Dockerfile
    container_name: zeuspro-ai-engine
    restart: always
    depends_on:
      - postgres
    ports:
      - "${AI_PORT}:8000"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - zeuspro-network

  # ---------------------------------------------------------
  # 7. Web Frontend (Next.js) - NOVO!
  # ---------------------------------------------------------
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: zeuspro-web
    restart: always
    ports:
      - "80:80" # Acessível direto em http://localhost
    networks:
      - zeuspro-network
    volumes:
      - ./web:/app # Mapeamento para Hot-Reloading!
      - /app/node_modules

volumes:
  zeuspro_pg_data:
  zeuspro_redis_data:
  zeuspro_mongo_data:
  zeuspro_evolution_store:

networks:
  zeuspro-network:
    driver: bridge